name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build, typecheck, lint, and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://forge:forge@localhost:5432/forge?schema=public
      REDIS_URL: redis://localhost:6379
      API_KEY_HASH_PEPPER: ci-only-pepper-not-a-secret
      NODE_ENV: test
    strategy:
      matrix:
        node-version: [22]

    steps:
      # Same images and credentials as the old `services:` block, but started
      # in the background so the image pulls and database boot overlap with
      # checkout, install, audit, Prisma generate and lint instead of blocking
      # the job for ~22s in "Initialize containers" before checkout. The wait
      # step blocks until both are healthy before migrations, so typecheck,
      # build and tests see the same migrated database as before.
      # pg_isready goes over TCP so the entrypoint's socket-only init server
      # can't report healthy before the real server is listening.
      - name: Start Postgres and Redis
        run: |
          # Each start runs in the background; its exit code is written to a
          # file so the wait step fails at once (with the docker output) if a
          # pull or start fails, instead of polling out its window.
          (docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=forge -e POSTGRES_PASSWORD=forge -e POSTGRES_DB=forge \
            --health-cmd "pg_isready -h 127.0.0.1 -U forge -d forge" \
            --health-interval 1s --health-timeout 5s --health-retries 50 \
            postgres:16-alpine > "$RUNNER_TEMP/postgres-start.log" 2>&1 &&
            echo 0 > "$RUNNER_TEMP/postgres-start.rc" ||
            echo $? > "$RUNNER_TEMP/postgres-start.rc") &
          (docker run -d --name redis -p 6379:6379 \
            --health-cmd "redis-cli ping" \
            --health-interval 1s --health-timeout 5s --health-retries 50 \
            redis:7-alpine > "$RUNNER_TEMP/redis-start.log" 2>&1 &&
            echo 0 > "$RUNNER_TEMP/redis-start.rc" ||
            echo $? > "$RUNNER_TEMP/redis-start.rc") &

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint and format check
        run: pnpm lint

      - name: Wait for Postgres and Redis
        run: |
          for svc in postgres redis; do
            for _ in $(seq 1 50); do
              rc=$(cat "$RUNNER_TEMP/$svc-start.rc" 2>/dev/null || true)
              if [ -n "$rc" ] && [ "$rc" != 0 ]; then
                echo "::error::docker run for $svc exited $rc"
                cat "$RUNNER_TEMP/$svc-start.log"
                exit 1
              fi
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$svc" 2>/dev/null || true)
              [ "$status" = healthy ] && break
              sleep 1
            done
            if [ "$status" != healthy ]; then
              echo "::error::$svc did not become healthy (status: ${status:-missing})"
              cat "$RUNNER_TEMP/$svc-start.log" || true
              docker logs "$svc" || true
              exit 1
            fi
          done

      - name: Verify deployment migrations
        run: pnpm db:migrate:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
