name: Feature request
description: Suggest an improvement to ForgeAPI Platform
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem first so the proposed solution can be evaluated in context.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve, and who would benefit?
      placeholder: Describe the use case and current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like ForgeAPI to do?
      placeholder: Describe the expected behavior or API.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives or workarounds have you tried?
    validations:
      required: false
